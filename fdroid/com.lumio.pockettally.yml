# Draft build recipe for the F-Droid inventory (fdroiddata).
# Copy this file to metadata/com.lumio.pockettally.yml in a fork of
# https://gitlab.com/fdroid/fdroiddata and open a merge request.
# The reviewers may ask for small changes (Flutter version, paths).

Categories:
  - Money
License: GPL-3.0-only
AuthorName: Lumio Apps
WebSite: https://github.com/lumio-apps/pockettally
SourceCode: https://github.com/lumio-apps/pockettally
IssueTracker: https://github.com/lumio-apps/pockettally/issues
Changelog: https://github.com/lumio-apps/pockettally/blob/HEAD/CHANGELOG.md

AutoName: PocketTally

RepoType: git
Repo: https://github.com/lumio-apps/pockettally.git

Builds:
  - versionName: 1.3.4
    versionCode: 31
    commit: v1.3.4
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - '[ -d android ] || $$flutter$$/bin/flutter create --org com.lumio --project-name pockettally --platforms android .'
      - python3 tool/prepare_android.py manifest --fdroid
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run flutter_launcher_icons
      - $$flutter$$/bin/dart run flutter_native_splash:create
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=UPDATER=false

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.4
CurrentVersionCode: 31
