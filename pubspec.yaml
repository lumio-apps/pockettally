name: pockettally
description: Simple offline daily income and expense tracker.
publish_to: "none"
version: 0.9.1+12

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  # Desktop (Windows, Linux): sqflite through FFI with a bundled SQLite.
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: any # the version Flutter's localizations use
  http: ^1.2.2
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  file_picker: ^10.3.10
  pdf: ^3.11.3
  image_picker: ^1.1.2
  # Android: launcher shortcuts and the home screen widget.
  quick_actions: ^1.1.0
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true # builds lib/l10n/app_localizations.dart from the .arb files
  assets:
    - assets/icon/logo.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf

# App icon. Generated in CI with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E3B30"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# Launch screen. Generated in CI with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0E3B30"
  image: assets/splash/splash.png
  color_dark: "#0A2620"
  image_dark: assets/splash/splash.png
  android_12:
    color: "#0E3B30"
    image: assets/splash/splash_android12.png
    icon_background_color: "#0E3B30"
    color_dark: "#0A2620"
    image_dark: assets/splash/splash_android12.png
    icon_background_color_dark: "#0A2620"
  ios: false
  web: false
