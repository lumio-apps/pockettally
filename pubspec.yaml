name: pockettally
description: Simple offline daily income and expense tracker.
publish_to: "none"
version: 1.3.11+38

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: any # the version Flutter's localizations use
  package_info_plus: ^8.0.2
  http: ^1.2.2
  open_filex: ^4.5.0
  file_picker: ^10.3.10
  pdf: ^3.11.3
  image_picker: ^1.1.2
  # App lock: the PIN is stored only as a salted hash.
  crypto: ^3.0.3
  # Daily reminder (Android only).
  flutter_local_notifications: ^22.0.0
  timezone: any # the version flutter_local_notifications uses

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true # builds lib/l10n/app_localizations.dart from the .arb files
  assets:
    - assets/icon/logo_light.png
    - assets/icon/logo_dark.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf

# App icon. Generated in CI with: dart run flutter_launcher_icons
# The pictures are drawn by: python3 tool/make_logo.py assets
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ "Themed icons": the phone colours this one itself,
  # light in light mode and dark in dark mode.
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  # The pictures already have the right margins, so no extra padding.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# Launch screen. Generated in CI with: dart run flutter_native_splash:create
# Light or dark with the phone's dark mode; the colours are the app's page colours.
flutter_native_splash:
  color: "#F5F8FD"
  image: assets/splash/splash.png
  color_dark: "#0B1220"
  image_dark: assets/splash/splash.png
  android_12:
    color: "#F5F8FD"
    image: assets/splash/splash_android12.png
    icon_background_color: "#F5F8FD"
    color_dark: "#0B1220"
    image_dark: assets/splash/splash_android12.png
    icon_background_color_dark: "#0B1220"
  ios: false
  web: false
