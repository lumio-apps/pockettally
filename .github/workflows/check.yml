name: Check code

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android/ folder only when the repo does not have one yet.
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --org com.lumio --project-name pockettally --platforms android .
          fi

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Debug build (compile check)
        run: flutter build apk --debug
