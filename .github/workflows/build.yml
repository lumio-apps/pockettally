name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --org com.lumio --project-name pockettally --platforms android .
          fi

      - name: Add permissions and app label
        run: python3 tool/prepare_android.py manifest

      - run: flutter pub get

      - name: Generate app icon and splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing. Add the 4 signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          python3 tool/prepare_android.py signing

      # One APK for every phone. Its version code is 10000 + the build
      # number from pubspec.yaml, so it is always higher than the old
      # processor-specific APKs (up to 4000 + build number) and installs
      # over them.
      - name: Build Android APK
        run: |
          BUILD=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          flutter build apk --release --build-number=$((10000 + BUILD))
          mv build/app/outputs/flutter-apk/app-release.apk \
            "pockettally-${{ github.ref_name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pockettally-apk
          path: pockettally-*-android.apk

      - name: Publish GitHub release (Android)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pockettally-*-android.apk
          generate_release_notes: true

  # ---------------- Windows: installer ----------------
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        run: flutter create --org com.lumio --project-name pockettally --platforms windows .

      - name: Window title and file details
        run: python tool/prepare_desktop.py windows

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/windows/launcher_icons.yaml

      - run: flutter build windows --release

      - name: Package installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }
          $release = "$pwd\build\windows\x64\runner\Release"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$release" "/DOutputName=pockettally-$tag-windows-setup" "/O$pwd" tool\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: pockettally-windows
          path: pockettally-*-windows-setup.exe

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pockettally-*-windows-setup.exe

  # ---------------- Linux: AppImage ----------------
  linux:
    needs: build
    # The oldest supported runner, so the AppImage also runs on older Linux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev file

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux project
        run: flutter create --org com.lumio --project-name pockettally --platforms linux .

      - name: Window title
        run: python3 tool/prepare_desktop.py linux

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Package AppImage
        run: |
          TAG="${{ github.ref_name }}"
          BUNDLE=build/linux/x64/release/bundle

          # AppImage: one file, double-click to run, updates itself.
          mkdir -p AppDir/usr/bin
          cp -r "$BUNDLE"/. AppDir/usr/bin/
          cp tool/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp tool/linux/pockettally.desktop AppDir/pockettally.desktop
          cp assets/icon/icon.png AppDir/pockettally.png
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir "pockettally-$TAG-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: pockettally-linux
          path: pockettally-*-linux-x86_64.AppImage

      - name: Add to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pockettally-*-linux-x86_64.AppImage
