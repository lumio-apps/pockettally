name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --org com.lumio --project-name pockettally --platforms android .
          fi

      - name: Add permissions and app label
        run: python3 tool/prepare_android.py manifest

      - run: flutter pub get

      - name: Generate app icon and splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing. Add the 4 signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          python3 tool/prepare_android.py signing

      # One APK for every phone. Its version code is 10000 + the build
      # number from pubspec.yaml, so it is always higher than the old
      # processor-specific APKs (up to 4000 + build number) and installs
      # over them.
      - name: Build Android APK
        run: |
          BUILD=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          flutter build apk --release --build-number=$((10000 + BUILD))
          mv build/app/outputs/flutter-apk/app-release.apk \
            "pockettally-${{ github.ref_name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pockettally-apk
          path: pockettally-*-android.apk

      - name: Publish GitHub release (Android)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pockettally-*-android.apk
          generate_release_notes: true
          # Test tags (v1.1.0-test1) make a pre-release: only for trying,
          # never shown as the latest release.
          prerelease: ${{ contains(github.ref_name, '-test') }}

  # ---------------- Google Play: signed app bundle ----------------
  # Not published anywhere. Download it from the "Artifacts" of the run and
  # upload it in Play Console. It is signed with the same key as the APK,
  # which Google Play then uses as the upload key.
  # Difference to the APK: no exact
  # alarms (Google Play allows those for alarm clock and calendar apps only).
  play:
    # Test tags only build the Android APK.
    if: ${{ !contains(github.ref_name, '-test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --org com.lumio --project-name pockettally --platforms android .

      - name: Add permissions and app label (Play version)
        run: python3 tool/prepare_android.py manifest --play

      - run: flutter pub get

      - name: Generate app icon and splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Test the bundle checker
        run: python3 tool/check_play_bundle.py --self-test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing. Add the 4 signing secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          python3 tool/prepare_android.py signing

      # The version code is the build number from pubspec.yaml (every upload
      # to Google Play needs a higher one than the one before).
      - name: Build Android app bundle
        run: |
          BUILD=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          flutter build appbundle --release \
            --dart-define=EXACT_ALARMS=false \
            --build-number=$BUILD
          mv build/app/outputs/bundle/release/app-release.aab \
            "pockettally-${{ github.ref_name }}-play.aab"

      # Fails when a native library is not ready for 16 KB pages or a
      # permission Google Play does not allow is in the app.
      - name: Check the bundle for Google Play
        run: python3 tool/check_play_bundle.py "pockettally-${{ github.ref_name }}-play.aab" build

      - uses: actions/upload-artifact@v4
        with:
          name: pockettally-play-aab
          path: pockettally-*-play.aab
          retention-days: 30
